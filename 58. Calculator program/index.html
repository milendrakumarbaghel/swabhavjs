<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-app">
        <section class="calculator" aria-label="Calculator">
            <div class="display" aria-live="polite">
                <div class="previous-operation" id="previousOperation"></div>
                <output class="current-operation" id="currentOperation">0</output>
            </div>

            <div class="keys">
                <button class="key function" type="button" data-action="clear">AC</button>
                <button class="key function" type="button" data-action="delete">DEL</button>
                <button class="key function" type="button" data-action="percent">%</button>
                <button class="key operator" type="button" data-operator="/">/</button>

                <button class="key" type="button" data-number="7">7</button>
                <button class="key" type="button" data-number="8">8</button>
                <button class="key" type="button" data-number="9">9</button>
                <button class="key operator" type="button" data-operator="*">x</button>

                <button class="key" type="button" data-number="4">4</button>
                <button class="key" type="button" data-number="5">5</button>
                <button class="key" type="button" data-number="6">6</button>
                <button class="key operator" type="button" data-operator="-">-</button>

                <button class="key" type="button" data-number="1">1</button>
                <button class="key" type="button" data-number="2">2</button>
                <button class="key" type="button" data-number="3">3</button>
                <button class="key operator" type="button" data-operator="+">+</button>

                <button class="key zero" type="button" data-number="0">0</button>
                <button class="key" type="button" data-action="decimal">.</button>
                <button class="key equals" type="button" data-action="calculate">=</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
